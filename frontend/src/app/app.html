<app-shell
  [nav]="nav"
  [barKeys]="barKeys"
  [brand]="brand"
  [searchable]="false"
  [more]="false"
  [outlet]="ready()"
>
  <app-rail-button
    shellRailEnd
    [icon]="theme.resolved() === 'dark' ? 'sun' : 'moon'"
    [label]="theme.resolved() === 'dark' ? 'Light' : 'Dark'"
    (click)="theme.toggle()"
  />
  <app-bar-button
    shellBarEnd
    [icon]="theme.resolved() === 'dark' ? 'sun' : 'moon'"
    [label]="theme.resolved() === 'dark' ? 'Light' : 'Dark'"
    (click)="theme.toggle()"
  />

  <ng-container ngProjectAs="[shellMain]">
    @if (!ready()) {
      @if (locked()) {
        <app-key-prompt [rejected]="rejected()" (unlock)="unlock($event)" />
      } @else {
        @switch (store.state()) {
          @case ('offline') {
            <div class="state">
              <app-empty-state
                heading="You are offline"
                body="The app needs a connection to the installation. Check the network or the Raspberry Pi."
                icon="globe"
              />
              <app-button variant="fill" (click)="retry()">Try again</app-button>
            </div>
          }
          @case ('error') {
            <div class="state">
              <app-empty-state
                heading="The data did not load"
                [body]="store.error()"
                icon="alert"
              />
              <app-button variant="fill" (click)="retry()">Try again</app-button>
            </div>
          }
          @default {
            <div class="state">
              <span class="spinner" role="status" aria-label="Loading"></span>
            </div>
          }
        }
      }
    }
  </ng-container>
</app-shell>
