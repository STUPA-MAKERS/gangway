<div class="pp" [class.pp--split]="split()">
  <app-list-detail [detailOpen]="selected() !== null" (back)="close()">
    <section list class="ld-pane pp__pane" aria-labelledby="pp-title">
      <h1 id="pp-title" class="page-title pp__title">Presets</h1>

      <div class="pp__scroll">
        @if (store.presets().length) {
          <div class="pp__rows" [class.rowgroup]="!split()" role="list" aria-label="Presets">
            @for (name of store.presets(); track name) {
              <app-list-item
                role="listitem"
                [title]="name"
                [link]="['/presets', name]"
                [selected]="name === selected()"
              >
                <app-row-menu
                  trail
                  [label]="'Actions for ' + name"
                  [sections]="rowMenu"
                  (selected)="onMenu(name, $event)"
                />
              </app-list-item>
            }
          </div>
        } @else {
          <app-empty-state
            heading="No presets yet"
            body="Save the current animation as a preset."
            icon="list"
          />
        }
      </div>

      <div class="pp__fab" [class.pp__fab--contained]="split()">
        <app-button
          variant="fab"
          [iconOnly]="true"
          ariaLabel="New preset"
          title="New preset"
          (click)="startCreate()"
        >
          <app-icon name="plus" />
        </app-button>
      </div>
    </section>

    <div detail class="pp__detail">
      @if (selected(); as name) {
        <article class="pp__sheet" aria-labelledby="pp-sheet-title">
          <app-sheet-bar [bleed]="split()">
            <h2 appSheetBarTitle id="pp-sheet-title" class="pp__sheet-title">{{ name }}</h2>
            <app-button
              variant="tonal"
              [disabled]="busy()"
              [ariaLabel]="'Load ' + name"
              (click)="load(name)"
            >
              <span class="btn-label"><app-icon name="play" [size]="18" /> Load</span>
            </app-button>
            <app-row-menu
              [label]="'Actions for ' + name"
              [sections]="sheetMenu"
              (selected)="onMenu(name, $event)"
            />
          </app-sheet-bar>

          @if (loading()) {
            <div class="pp__state">
              <span class="spinner" role="status" aria-label="Loading"></span>
            </div>
          } @else {
            <app-animation-editor
              [value]="draft()"
              [animations]="store.animations()"
              [presets]="store.presets()"
              [strips]="store.config()?.strips ?? []"
              [problems]="problems()"
              (changed)="draft.set($event)"
            />
          }
        </article>

        @if (dirty() || busy()) {
          <div class="fabs">
            <app-button
              class="fab-reset"
              variant="fab"
              [iconOnly]="true"
              ariaLabel="Reset"
              title="Reset"
              [disabled]="busy()"
              (click)="confirmReset.set(true)"
            >
              <app-icon name="reset" />
            </app-button>
            <app-button
              variant="fab"
              [iconOnly]="true"
              ariaLabel="Save"
              title="Save"
              [disabled]="!canSave() && !busy()"
              [loading]="busy()"
              (click)="save()"
            >
              <app-icon name="check" />
            </app-button>
          </div>
        }
      } @else if (split()) {
        <app-empty-state
          class="pp__none"
          heading="No preset open"
          body="Pick a preset in the list to edit it."
          icon="list"
          shape="card"
          fill
        />
      }
    </div>
  </app-list-detail>
</div>

<app-dialog
  title="New preset"
  subtitle="Saves the animation of the animation page."
  closeLabel="Close"
  [open]="creating()"
  (closed)="creating.set(false)"
>
  <form id="create-form" (ngSubmit)="create()">
    <app-input
      label="Name"
      name="newName"
      hint="Letters, digits, spaces, hyphens and underscores."
      [error]="newNameError()"
      [ngModel]="newName()"
      (ngModelChange)="newName.set($event)"
    />
  </form>
  <app-button dialog-footer variant="text" (click)="creating.set(false)">Cancel</app-button>
  <app-button
    dialog-footer
    variant="fill"
    [loading]="busy()"
    [disabled]="!newName().trim() || !!newNameError()"
    (click)="create()"
    >Save</app-button
  >
</app-dialog>

<app-dialog
  title="Rename preset"
  [subtitle]="renaming() ?? ''"
  closeLabel="Close"
  [open]="renaming() !== null"
  (closed)="renaming.set(null)"
>
  <form id="rename-form" (ngSubmit)="rename()">
    <app-input
      label="New name"
      name="renameTo"
      hint="Letters, digits, spaces, hyphens and underscores."
      [error]="renameError()"
      [ngModel]="renameTo()"
      (ngModelChange)="renameTo.set($event)"
    />
  </form>
  <app-button dialog-footer variant="text" (click)="renaming.set(null)">Cancel</app-button>
  <app-button
    dialog-footer
    variant="fill"
    [loading]="busy()"
    [disabled]="!renameTo().trim() || !!renameError() || renameTo().trim() === renaming()"
    (click)="rename()"
    >Rename</app-button
  >
</app-dialog>

<app-confirm-dialog
  [open]="confirmReset()"
  title="Reset the changes?"
  body="The editor goes back to the saved preset."
  confirmLabel="Reset"
  (confirm)="reset()"
  (cancel)="confirmReset.set(false)"
/>

<app-confirm-dialog
  [open]="deleting() !== null"
  title="Delete the preset?"
  [subtitle]="deleting() ?? ''"
  confirmLabel="Delete"
  [busy]="busy()"
  (confirm)="remove()"
  (cancel)="deleting.set(null)"
/>
