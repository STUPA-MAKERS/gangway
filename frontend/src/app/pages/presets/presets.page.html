<div class="pp" [class.pp--split]="split()">
  <app-list-detail [detailOpen]="selected() !== null" (back)="close()">
    <section list class="ld-pane pp__pane" aria-labelledby="pp-title">
      <app-page-header [pane]="true" title="Presets" titleId="pp-title" />

      <app-sticky-bar class="ld-pane__filters">
        <app-search-pill
          [size]="phone() ? 'md' : 'lg'"
          [placeholder]="'Search ' + store.presets().length + ' presets'"
          label="Search presets"
          [clearable]="true"
          [value]="search()"
          (valueChange)="search.set($event)"
        />
      </app-sticky-bar>

      <div class="pp__scroll" appScrollFade="y">
        @if (filtered().length) {
          <section class="pp__group" aria-labelledby="pp-group">
            <h2 id="pp-group" class="sec pp__group-head">
              Saved <span class="pp__count">{{ filtered().length }}</span>
            </h2>
            <div class="pp__rows" [class.rowgroup]="!split()" role="list">
              @for (name of filtered(); track name) {
                <app-list-item
                  role="listitem"
                  class="pp__row"
                  [title]="name"
                  [sub]="summaries().get(name) ?? null"
                  [link]="['/presets', name]"
                  [selected]="name === selected()"
                >
                  <app-row-menu
                    trail
                    [label]="'Actions for ' + name"
                    [sections]="rowMenu"
                    (selected)="onMenu(name, $event)"
                  />
                </app-list-item>
              }
            </div>
          </section>
        } @else if (search().trim()) {
          <app-empty-state heading="No preset matches" body="Try another search." icon="search" />
        } @else {
          <app-empty-state
            heading="No presets yet"
            body="Save the current animation as a preset."
            icon="list"
          />
        }
      </div>

      <app-fab
        label="New preset"
        icon="plus"
        [iconOnly]="true"
        [contained]="split()"
        (activate)="startCreate()"
      />
    </section>

    <div detail class="pp__detail">
      @if (selected(); as name) {
        <article class="pp__sheet" aria-labelledby="pp-sheet-title">
          <header class="sheet-head">
            <app-sheet-bar [bleed]="split()">
              <h2 appSheetBarTitle id="pp-sheet-title" class="sheet-title">{{ name }}</h2>
              <app-row-menu
                [label]="'Actions for ' + name"
                [sections]="sheetMenu"
                (selected)="onMenu(name, $event)"
              />
            </app-sheet-bar>
          </header>

          <section class="pp__section" aria-label="Animation">
            @if (loading()) {
              <div class="pp__state">
                <span class="spinner" role="status" aria-label="Loading"></span>
              </div>
            } @else {
              <app-animation-editor
                [value]="draft()"
                [animations]="store.animations()"
                [presets]="store.presets()"
                [strips]="store.config()?.strips ?? []"
                [problems]="problems()"
                (changed)="draft.set($event)"
              />
            }
          </section>
        </article>

        <app-fab-group>
          @if (dirty() || busy()) {
            <app-fab
              label="Reset"
              icon="reset"
              tone="neutral"
              [iconOnly]="true"
              [disabled]="busy()"
              (activate)="confirmReset.set(true)"
            />
            <app-fab
              label="Save"
              icon="check"
              [iconOnly]="true"
              [disabled]="!canSave() && !busy()"
              [loading]="busy()"
              (activate)="save()"
            />
          }
          <app-fab
            [label]="'Load ' + name"
            icon="play"
            [iconOnly]="true"
            [disabled]="busy()"
            (activate)="load(name)"
          />
        </app-fab-group>
      } @else if (split()) {
        <app-detail-none
          icon="list"
          heading="No preset open"
          body="Pick a preset in the list to edit it."
        />
      }
    </div>
  </app-list-detail>
</div>

<app-dialog
  title="New preset"
  subtitle="Saves the animation of the animation page."
  closeLabel="Close"
  [open]="creating()"
  (closed)="creating.set(false)"
>
  <form id="create-form" (ngSubmit)="create()">
    <app-input
      label="Name"
      name="newName"
      hint="Letters, digits, spaces, hyphens and underscores."
      [error]="newNameError()"
      [ngModel]="newName()"
      (ngModelChange)="newName.set($event)"
    />
  </form>
  <app-button dialog-footer variant="text" (click)="creating.set(false)">Cancel</app-button>
  <app-button
    dialog-footer
    variant="fill"
    [loading]="busy()"
    [disabled]="!newName().trim() || !!newNameError()"
    (click)="create()"
    >Save</app-button
  >
</app-dialog>

<app-dialog
  title="Rename preset"
  [subtitle]="renaming() ?? ''"
  closeLabel="Close"
  [open]="renaming() !== null"
  (closed)="renaming.set(null)"
>
  <form id="rename-form" (ngSubmit)="rename()">
    <app-input
      label="New name"
      name="renameTo"
      hint="Letters, digits, spaces, hyphens and underscores."
      [error]="renameError()"
      [ngModel]="renameTo()"
      (ngModelChange)="renameTo.set($event)"
    />
  </form>
  <app-button dialog-footer variant="text" (click)="renaming.set(null)">Cancel</app-button>
  <app-button
    dialog-footer
    variant="fill"
    [loading]="busy()"
    [disabled]="!renameTo().trim() || !!renameError() || renameTo().trim() === renaming()"
    (click)="rename()"
    >Rename</app-button
  >
</app-dialog>

<app-confirm-dialog
  [open]="confirmReset()"
  title="Reset the changes?"
  body="The editor goes back to the saved preset."
  confirmLabel="Reset"
  (confirm)="reset()"
  (cancel)="confirmReset.set(false)"
/>

<app-confirm-dialog
  [open]="deleting() !== null"
  title="Delete the preset?"
  [subtitle]="deleting() ?? ''"
  confirmLabel="Delete"
  [busy]="busy()"
  (confirm)="remove()"
  (cancel)="deleting.set(null)"
/>
